[project]
name = "agentic-rag-kit"
version = "0.1.0"
description = "Hexagonal agentic RAG kit with pluggable domain packs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
include = ["src", "packs", "evaluation", "tests"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.importlinter]
root_package = "rag_kit"
